receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        keep_alives_enabled: false

processors:
  batch:

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  file/logs:
    path: /var/otel-logs/logs.json
    format: json
  file/traces:
    path: /var/otel-logs/traces.json
    format: json

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
  # Traces and logs pipelines export to files under /var/otel-logs so you can inspect forwarded data.
